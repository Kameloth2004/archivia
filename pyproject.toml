[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archivia"
version = "0.1.0"
description = "Bibliotecário digital local, começando por inventário somente leitura"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]

[project.scripts]
archivia = "archivia.cli:main"
archivia-gui = "archivia.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
